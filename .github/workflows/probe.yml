name: Probe APIs
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.1.2', '26.2', '26.3', '1.21.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: Resolve Minecraft
        run: |
          chmod +x ./gradlew
          if [ "${{ matrix.mc }}" = "1.21.11" ]; then ./gradlew -p mc1.21.11 genSourcesWithVineflower --dry-run >/dev/null 2>&1 || true; ./gradlew -p mc1.21.11 dependencies --configuration compileClasspath >/dev/null; else ./gradlew -Pmc=${{ matrix.mc }} dependencies --configuration compileClasspath >/dev/null; fi
      - name: Dump classes
        run: |
          find ~/.gradle/caches mc1.21.11/.gradle .gradle -name '*.jar' 2>/dev/null | grep -i -E 'minecraft' | grep -v -E 'sources|libraries' | head -20
          J=$(find ~/.gradle/caches mc1.21.11/.gradle .gradle -name '*.jar' 2>/dev/null | grep -i -E 'minecraft-(merged|client|common|clientOnly)' | grep -v sources | grep -E "${{ matrix.mc }}" | head -5 | tr '\n' ':')
          echo "CP=$J"
          for c in 'com.mojang.blaze3d.platform.InputConstants$Type' 'com.mojang.blaze3d.platform.InputConstants' 'net.minecraft.client.KeyMapping' 'net.minecraft.client.KeyMapping$Category'; do echo "##### $c"; javap -cp "$J" -p "$c" | grep -v -E '^\s*private' | head -60; done
          echo "##### Gui overlay"; javap -cp "$J" -p net.minecraft.client.gui.Gui | grep -i -E 'overlay|actionbar|ActionBar' || true
          echo "##### Player/LocalPlayer messages"; for c in net.minecraft.world.entity.player.Player net.minecraft.client.player.LocalPlayer; do javap -cp "$J" -p $c | grep -i -E 'message|overlay|actionbar' || true; done
          echo "##### Identifier"; javap -cp "$J" -p net.minecraft.resources.Identifier 2>&1 | grep -E 'fromNamespaceAndPath|class ' | head -3 || true
      - name: Fabric API key helpers
        run: |
          find ~/.gradle/caches -name 'fabric-key-*.jar' | grep -v sources | head
