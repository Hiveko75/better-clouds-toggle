# Builds both jars and publishes them as a GitHub release.
# Run from the Actions tab: Release -> Run workflow (the tag defaults to mod_version).
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (empty = mod_version from gradle.properties)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace
          ./gradlew -p mc1.21.11 build --stacktrace
          mkdir dist
          cp build/libs/*+mc26.1.2-26.3.jar mc1.21.11/build/libs/*+mc1.21.11.jar dist/
          ls -l dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          cat > notes.md <<'NOTES'
          Adds a key binding that switches [Better Clouds](https://modrinth.com/mod/better-clouds) on and off, the same as its **Enable** option, without modifying Better Clouds.

          - Bind it under *Options → Controls → Key Binds → Better Clouds → Toggle Better Clouds* (unbound by default).
          - Shows "Better Clouds: On/Off" above the hotbar. Takes effect immediately and is saved to Better Clouds' own config; while off, vanilla clouds are shown.

          | File | Minecraft |
          |---|---|
          | `better-clouds-toggle-*+mc26.1.2-26.3.jar` | 26.1.2, 26.2, 26.3 |
          | `better-clouds-toggle-*+mc1.21.11.jar` | 1.21.11 |

          Requires Fabric API and Better Clouds. Client-side only.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$TAG" dist/*.jar --target "$GITHUB_SHA" --title "Better Clouds Toggle $TAG" --notes-file notes.md
