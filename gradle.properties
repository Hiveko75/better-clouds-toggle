org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

loom_version=1.16-SNAPSHOT

mod_version=1.0.0
maven_group=io.github.hiveko
archives_base_name=better-clouds-toggle

# The 26.x jar is built against the lowest supported version and declared for the whole range.
# CI also compiles it against every version in versions/ (-Pmc=<version>) and checks the bytecode
# is identical, so the one jar is known to work on all of them.
mc_default=26.1.2
minecraft_range=>=26.1.2 <26.4-
loader_min=0.19.2
